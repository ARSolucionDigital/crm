name: Deploy BookStack

on:
  workflow_dispatch:
    inputs:
      bookstack_image:
        description: 'Pinned BookStack image reference (tag or digest)'
        required: true
        default: 'lscr.io/linuxserver/bookstack@sha256:189c796273469115cf810e53f450e15b93184018e4728cd65fcaef8aa93584bc'
      mariadb_image:
        description: 'Pinned MariaDB image reference (tag or digest)'
        required: true
        default: 'mariadb@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install and deploy BookStack infrastructure
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          BOOKSTACK_IMAGE: ${{ inputs.bookstack_image }}
          MARIADB_IMAGE: ${{ inputs.mariadb_image }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ "$BOOKSTACK_IMAGE" =~ ^[A-Za-z0-9./:@_-]+$ ]]
          [[ "$MARIADB_IMAGE" =~ ^[A-Za-z0-9./:@_-]+$ ]]
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" 'mkdir -p /opt/twenty-crm/managed/bookstack'
          scp "${ssh_opts[@]}" infra/bookstack/bookstack.compose.yml infra/bookstack/backup-bookstack.sh infra/bookstack/deploy-bookstack.sh infra/bookstack/rollback-bookstack.sh "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/twenty-crm/managed/bookstack/"
          ssh "${ssh_opts[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" "export BOOKSTACK_IMAGE='$BOOKSTACK_IMAGE' MARIADB_IMAGE='$MARIADB_IMAGE'; chmod 700 /opt/twenty-crm/managed/bookstack/*.sh; DEPLOY_DIR=/opt/twenty-crm ENV_FILE=/opt/twenty-crm/.env.bookstack /opt/twenty-crm/managed/bookstack/deploy-bookstack.sh"
