name: bookstack

services:
  bookstack:
    image: ${BOOKSTACK_IMAGE:?BOOKSTACK_IMAGE must be pinned to a version or digest}
    container_name: bookstack
    restart: always
    ports:
      - "127.0.0.1:${BOOKSTACK_PORT:-8080}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bookstack}
      DB_USERNAME: ${DB_USERNAME:-bookstack}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - bookstack-data:/config
    depends_on:
      bookstack-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 256M

  bookstack-db:
    image: ${MARIADB_IMAGE:-mariadb:10.11}
    container_name: bookstack-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_DATABASE:-bookstack}
      MARIADB_USER: ${DB_USERNAME:-bookstack}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - bookstack-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  bookstack-data:
  bookstack-db-data:
